# Builds the wheels users install, one per platform, with cibuildwheel, and checks each one in a fresh
# environment: installed there, it passes the tests listed under [tool.cibuildwheel] in pyproject.toml.
# Also builds the source distribution, which carries Eigen and pocketfft, and checks that it installs
# with only a C++ compiler, downloading no C++ library. On a version tag, once every wheel and the
# source distribution pass, publishes them to PyPI through trusted publishing: no token is stored.
name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-latest }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-x86_64, runner: windows-latest }
    steps:
      # Checked out as committed: Windows would otherwise turn line endings into CRLF.
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # On Linux the wheel is built and tested inside a manylinux container, so it runs on any
      # distribution with a recent enough glibc; elsewhere it is built on the runner itself.
      - uses: pypa/cibuildwheel@v4.3.1
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes exact versions only
        with:
          python-version: "3.14"
      - name: Put Eigen and pocketfft into cpp/third_party
        run: cmake -P cpp/cmake/vendor.cmake
      # --no-config: the build in an isolated environment, as pip builds it, not in the uv
      # environment as [tool.uv] in pyproject.toml asks for development.
      - name: Build the source distribution
        run: uv build --no-config --sdist --out-dir dist
      # FETCHCONTENT_FULLY_DISCONNECTED stops CMake from downloading anything, so the build passes
      # only with the C++ libraries the source distribution carries. The Python build tools still
      # come from PyPI, as for any source build.
      - name: Install from the source distribution in a fresh environment
        run: |
          uv venv --no-config --python 3.14 sdist-env
          uv pip install --no-config --python sdist-env dist/*.tar.gz pytest pytest-xdist nibabel \
            -C cmake.define.FETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Test the installed package
        run: sdist-env/bin/python -m pytest -p no:cacheprovider tests/test_core.py tests/dwi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    # The PyPI project trusts this repository, this workflow and this environment only.
    environment:
      name: pypi
      url: https://pypi.org/project/larmor-dmri/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
